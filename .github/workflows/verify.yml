name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go, Python, and paper replay
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run shared verification
        run: python -B scripts/verify.py

      - name: Install pinned gobco
        run: |
          go install github.com/rillig/gobco@v1.3.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go env GOPATH | ForEach-Object { Join-Path $_ bin } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Report Go coverage
        run: python -B scripts/go_coverage.py --report-only
