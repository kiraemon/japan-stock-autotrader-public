name: Go coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.timeout }}
    outputs:
      c0: ${{ steps.measure.outputs.c0 }}
      c1: ${{ steps.measure.outputs.c1 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - metric: c0
            name: Go C0 statements
            timeout: 10
          - metric: c1
            name: Go C1 branches
            timeout: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned gobco
        if: matrix.metric == 'c1'
        run: |
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'gobco-bin'
          go install github.com/rillig/gobco@v1.3.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Report coverage
        id: measure
        run: python -B scripts/go_coverage.py --metric ${{ matrix.metric }} --report-only

  comment:
    name: Update PR coverage comment
    needs: coverage
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update coverage
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          COVERAGE_C0: ${{ needs.coverage.outputs.c0 }}
          COVERAGE_C1: ${{ needs.coverage.outputs.c1 }}
        with:
          script: |
            const {owner, repo, number} = context.issue;
            const target = {owner, repo, issue_number: number};
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.state !== 'open' || pr.head.sha !== context.payload.pull_request.head.sha) {
              core.info('The PR closed or moved to a newer commit.');
              return;
            }

            function row(label, raw) {
              const numbers = /^(\d{1,9})\/(\d{1,9})\/(\d{1,3})$/.exec(raw ?? '');
              if (!numbers) return `| ${label} | — | — | 計測結果なし |`;
              const [covered, total, target] = numbers.slice(1).map(Number);
              if (total === 0 || covered > total || target < 1 || target > 100) {
                return `| ${label} | — | — | 計測結果なし |`;
              }
              const percent = (100 * covered / total).toFixed(2);
              const status = covered * 100 >= total * target ? '達成' : '未達';
              return `| ${label} | ${percent}% (${covered} / ${total}) | ${target}% | ${status} |`;
            }

            const marker = '<!-- go-coverage-report -->';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### 対象Goコードのカバレッジ',
              '',
              '過去研究の再現専用ファイルを除いた集計です。',
              '',
              '| 指標 | 実測 | 目標 | 状態 |',
              '| --- | ---: | ---: | --- |',
              row('C0（文網羅）', process.env.COVERAGE_C0),
              row('C1（gobco）', process.env.COVERAGE_C1),
              '',
              `[計測ログ](${run})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, target);
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker + '\n'));
            if (previous) {
              if (previous.body !== body) {
                await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
              }
            } else {
              await github.rest.issues.createComment({...target, body});
            }
